name: release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag from conventional commits
        shell: bash
        run: |
          git fetch --tags --force --quiet

          last=$(git tag -l 'v*.*.*' | sort -V | tail -n1)
          if [ -z "${last}" ]; then
            last="v0.0.0"
            range="HEAD"
          else
            range="${last}..HEAD"
          fi

          subjects=$(git log --format='%s' "${range}")
          echo "Commits since ${last}:"
          echo "${subjects}" | sed 's/^/  /'

          if echo "${subjects}" | grep -qE '^feat(\([^)]+\))?!?:'; then
            bump=minor
          elif echo "${subjects}" | grep -qE '^fix(\([^)]+\))?!?:'; then
            bump=patch
          else
            echo "No feat/fix commits since ${last} — no release."
            echo "No release: no \`feat\`/\`fix\` commits since ${last}." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          IFS='.' read -r major minor patch <<< "${last#v}"
          if [ "${bump}" = minor ]; then
            next="v${major}.$((minor + 1)).0"
          else
            next="v${major}.${minor}.$((patch + 1))"
          fi

          echo "Bump ${bump}: ${last} -> ${next}"
          git tag "${next}"
          git push origin "${next}"
          echo "Released **${next}** (${bump} bump from ${last})" >> "${GITHUB_STEP_SUMMARY}"
