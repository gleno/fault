name: release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag next patch version
        shell: bash
        run: |
          git fetch --tags --force
          latest=$(git tag -l 'v*.*.*' | sort -V | tail -n1)
          latest=${latest:-v0.0.0}
          IFS='.' read -r major minor patch <<< "${latest#v}"
          next="v${major}.${minor}.$((patch + 1))"
          echo "latest: ${latest} -> next: ${next}"
          git tag "${next}"
          git push origin "${next}"
          echo "Released **${next}**" >> "${GITHUB_STEP_SUMMARY}"
